[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name (PyPI): apex-ontos - the APEX family brand, ruled by
# David 2026-11-05. The project, repo, import package, and CLI command
# are all still named Ontos / ontos; only the distribution name differs.
name = "apex-ontos"
version = "0.1.0"
description = "A certification-first auto-ontology layer for agents: generate a semantic layer from your data's metadata, certify the definitions, query deterministically - every answer carries its provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Ontos contributors" }]
keywords = ["ontology", "semantic-layer", "agents", "mcp", "provenance"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ontos = "ontos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ontos = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
